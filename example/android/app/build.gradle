def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}

android {
    namespace = "com.example.terminalSDK1"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.example.terminalSDK1"
        manifestPlaceholders = [
                applicationName: "android.app.Application",
                "appName": "demo.example",
        ]
        minSdk = 28
        targetSdk = flutter.targetSdkVersion
        versionCode = flutterVersionCode.toInteger()
        versionName = "75"
    }

    signingConfigs {
        release {
            // use key.properties or env vars
//            def props = new Properties()
//            def f = rootProject.file("key.properties")
//            if (f.exists()) {
//                f.withInputStream { props.load(it) }
//                storeFile file(props["storeFile"])
//                storePassword props["storePassword"]
//                keyAlias props["keyAlias"]
//                keyPassword props["keyPassword"]
//            }

        }
    }

    buildTypes {
        release {
            // only set if actually created/populated
//            if (sjigningConfigs.findByName("release") != null) {
//                signingConfig signingConfigs.release
//            }
//            minifyEnabled true
//            shrinkResources true
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.debug

        }
    }
}

flutter {
    source = "../.."
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.jetbrains.kotlin') {
            details.useVersion "1.9.10"
        }
    }
