plugins {
    id "com.android.library"
    id "org.jetbrains.kotlin.android"
}

android {
    compileSdk = 36
    namespace = "com.example.flutter_terminal_sdk"

    defaultConfig {
        minSdk = 28
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    java {
        toolchain {
            languageVersion.set(JavaLanguageVersion.of(17))
        }
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    testOptions {
        // The bridge classes touch android.os / android.util for logging on paths
        // the unit tests do not care about; stubbed returns keep those from
        // throwing "not mocked" instead of exercising the logic under test.
        unitTests.returnDefaultValues = true

        unitTests.all {
            useJUnitPlatform()

            testLogging {
                events("passed", "skipped", "failed", "standardOut", "standardError")
                outputs.upToDateWhen { false }
                showStandardStreams = true
            }
        }
    }

}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:2.0.21"
    implementation "io.nearpay:terminalsdk-release:0.2.6"
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.jakewharton.timber:timber:5.0.1'
    implementation 'com.google.code.gson:gson:2.13.2'

    // Testing
    testImplementation "org.jetbrains.kotlin:kotlin-test-junit5:2.0.21"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
    // MockK over Mockito: the bridge's collaborators (NearpayProvider, Activity,
    // MethodChannel) are final Kotlin/Android classes.
    testImplementation "io.mockk:mockk:1.13.10"
    // Real org.json on the unit-test classpath - the android.jar stub returns
    // null from every method, and NativeErrorPayload serializes through it.
    testImplementation "org.json:json:20240303"
}
